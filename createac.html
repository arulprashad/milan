<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="create.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <img src="logo.png" alt="Milan Detail Medics Logo" class="logo">
            <form action="#">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" >
                    <img src="person03.png" class="pass-icon" id="pass-icon">
                </div>

                <div class="input-group">
                    <label for="re-password">Re-enter Password</label>
                    <input type="password" id="re-password" >
                    <img src="person03.png" class="pass-icon" id="pass-icon">
                </div>

                <div class="terms">
                    <input type="checkbox" id="terms">
                    <label for="terms">I agree with terms & conditions</label>
                </div>

                <button type="submit" class="create-account-btn">Create Account</button>
                <div class="or">OR</div>

                <div class="already-account">
                    <span>Already have an account? </span><a href="#">Sign in</a>
                </div>
            </form>
            <button class="cancel-btn">Cancel</button>
        </div>
    </div>
</body>
</html>
